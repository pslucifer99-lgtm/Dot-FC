<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dot FC – Career Mode</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c2a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dot FC">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c2a22; --bg2:#103629; --panel:#154033; --panel2:#1b4d3d; --line:#2f6b57; --chalk:#eef4ee; --mut:#9bc0b0;
  --amber:#ffc933; --coral:#ff6a57; --sky:#6fd3ff; --ink:#07140f;
  --disp:'Big Shoulders Display','Arial Narrow','Impact',sans-serif; --body:'Figtree','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#e8f2ea; --bg2:#d9eadd; --panel:#ffffff; --panel2:#eef6f0; --line:#9cc3ad; --chalk:#10261d; --mut:#4c6e5e; --ink:#07140f; }
}
:root[data-theme="light"]{ --bg:#e8f2ea; --bg2:#d9eadd; --panel:#ffffff; --panel2:#eef6f0; --line:#9cc3ad; --chalk:#10261d; --mut:#4c6e5e; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.35;overflow:hidden;overscroll-behavior:none}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:800;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 92px);-webkit-overflow-scrolling:touch}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px;margin:0 0 12px}
.card.hero{background:linear-gradient(160deg,var(--panel2),var(--panel));border-color:var(--chalk)}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:6px}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.big{font-family:var(--disp);font-weight:900;line-height:.9}
.btn{border:2px solid var(--chalk);background:transparent;border-radius:4px;padding:11px 16px;font-weight:700;min-height:44px}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.shp{display:inline-block;width:20px;height:20px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}
.shp.lg{width:34px;height:34px}.shp.xl{width:54px;height:54px}
.s-circle{border-radius:50%}.s-sq{border-radius:3px}
.s-tri{clip-path:polygon(50% 4%,100% 96%,0 96%)}
.s-dia{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.s-hex{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.s-star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.s-oct{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
nav#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg2);border-top:2px solid var(--line);padding:0 4px calc(env(safe-area-inset-bottom,0px) + 4px);z-index:20}
nav#nav button{flex:1;background:none;border:0;padding:10px 2px 6px;font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.03em;color:var(--mut);position:relative}
nav#nav button.on{color:var(--amber)}
nav#nav button.on::after{content:"";position:absolute;left:22%;right:22%;top:0;height:3px;background:var(--amber)}
nav#nav .ct{position:absolute;top:4px;right:16%;background:var(--coral);color:var(--ink);border-radius:9px;font-size:11px;padding:0 5px;font-family:var(--body);font-weight:800}
.seg{display:flex;border:2px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;background:none;border:0;padding:8px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--chalk);color:var(--ink)}
input[type=text],select{width:100%;background:var(--bg);color:var(--chalk);border:2px solid var(--line);border-radius:4px;padding:10px;font:inherit;min-height:44px}
label.k{display:block;font-weight:700;margin:12px 0 6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);font-size:13.5px}
th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
tr.me td{background:rgba(255,201,51,.16);font-weight:700}
td.z1{box-shadow:inset 4px 0 0 var(--sky)}td.z2{box-shadow:inset 4px 0 0 var(--amber)}td.z3{box-shadow:inset 4px 0 0 var(--coral)}
.tn{display:flex;align-items:center;gap:7px}
.clubs{max-height:320px;overflow-y:auto;border:2px solid var(--line);border-radius:4px}
.club{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.club.sel{background:rgba(255,201,51,.2)}
.club b{display:block}.club small{color:var(--mut)}
.club .cn{flex:1;min-width:0}
.pill{display:inline-block;border:1.5px solid var(--line);border-radius:3px;padding:1px 7px;font-size:11.5px;font-weight:700;color:var(--mut)}
.pill.hi{border-color:var(--amber);color:var(--amber)}
.pill.ok{border-color:var(--sky);color:var(--sky)}
.stat{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stat .v{font-family:var(--disp);font-weight:900;font-size:30px;text-align:right;min-width:44px}
.stat .n{font-family:var(--disp);font-weight:800;font-size:20px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--amber)}
.ups{display:flex;gap:4px;margin-top:6px}
.ups .btn{padding:4px 9px;min-height:30px;font-size:12.5px}
#modal{position:fixed;inset:0;background:rgba(4,14,10,.82);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
#modal[hidden]{display:none}
#modal .sheet{background:var(--bg2);border-top:3px solid var(--amber);width:100%;max-width:560px;max-height:92%;overflow-y:auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);border-radius:10px 10px 0 0}
#snack{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);background:var(--chalk);color:var(--ink);font-weight:700;padding:9px 14px;border-radius:4px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#snack.on{opacity:1}
.fx{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 14px}
.vs{font-family:var(--disp);font-weight:900;font-size:26px;color:var(--mut)}
.score{font-family:var(--disp);font-weight:900;font-size:64px;line-height:1;text-align:center}
.menu{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px}
.logo{font-family:var(--disp);font-weight:900;font-size:76px;line-height:.85;letter-spacing:.01em}
.logo span{display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--amber);vertical-align:-.02em;margin-right:.08em}
.opt{display:flex;gap:8px}
.opt button{flex:1;border:2px solid var(--line);background:var(--panel);border-radius:4px;padding:12px 4px;font-family:var(--disp);font-weight:900;font-size:26px}
.opt button small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--mut)}
.opt button.on{border-color:var(--amber);background:rgba(255,201,51,.15)}
.alloc{display:flex;align-items:center;gap:8px;padding:5px 0}
.alloc .n{width:46px;font-family:var(--disp);font-weight:800;font-size:20px}
.alloc .v{flex:1;font-family:var(--disp);font-weight:900;font-size:24px}
.alloc button{width:40px;height:36px;border:2px solid var(--line);background:var(--panel2);border-radius:4px;font-weight:800;font-size:18px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
/* ---------- MATCH ---------- */
#match{position:fixed;inset:0;background:#0a1f18;z-index:40;touch-action:none;user-select:none;-webkit-user-select:none}
#match[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px;background:linear-gradient(#07140fee,#07140f00);height:calc(env(safe-area-inset-top,0px) + 58px);pointer-events:none}
#hud .t{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
#hud .t.r{justify-content:flex-end;text-align:right}
#hud .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud .m{text-align:center;min-width:88px}
#hs{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1}
#hk{font-size:12px;color:var(--amber);font-weight:700}
#hp{pointer-events:auto;background:#0008;border:2px solid var(--chalk);border-radius:4px;width:36px;height:36px;font-size:15px;padding:0}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--disp);font-weight:900;font-size:64px;line-height:.95;pointer-events:none;opacity:0;text-shadow:0 3px 0 #000a;padding:0 10px}
#banner small{display:block;font-family:var(--body);font-size:16px;font-weight:700;color:var(--amber);margin-top:6px;text-shadow:none}
#banner.on{animation:pop 1.7s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);text-align:center;font-weight:800;font-size:15px;pointer-events:none;opacity:0;text-shadow:0 2px 0 #000b}
#toast.on{animation:tst 1.3s ease-out forwards}
@keyframes tst{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#ctl{position:absolute;left:0;right:0;bottom:0;height:200px;pointer-events:none}
#joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:140px;height:140px;border-radius:50%;background:rgba(238,244,238,.1);border:3px solid rgba(238,244,238,.45);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;border-radius:50%;background:rgba(238,244,238,.55);border:3px solid #fff;transform:translate(-50%,-50%)}
.gb{position:absolute;border-radius:50%;border:3px solid var(--chalk);background:rgba(7,20,15,.55);font-family:var(--disp);font-weight:900;color:var(--chalk);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:.95;padding:0}
.gb:active,.gb.dn{background:var(--amber);color:var(--ink);border-color:var(--amber)}
#bA{width:88px;height:88px;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);font-size:19px;background:rgba(255,201,51,.3);border-color:var(--amber)}
#bB{width:70px;height:70px;right:calc(env(safe-area-inset-right,0px) + 116px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);font-size:16px}
#bS{width:58px;height:58px;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 168px);font-size:13px}
#bF{width:58px;height:58px;right:calc(env(safe-area-inset-right,0px) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + 122px);font-size:22px;opacity:.55;--f:0%;background:linear-gradient(to top,var(--coral) var(--f),rgba(7,20,15,.55) var(--f))}
#bF.rdy{opacity:1;animation:pulse .6s infinite alternate;border-color:var(--coral)}
@keyframes pulse{to{transform:scale(1.12)}}
#stam{position:absolute;left:calc(env(safe-area-inset-left,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 176px);width:140px;height:7px;background:#0007;border-radius:4px;overflow:hidden;border:1px solid #fff5}
#stam i{display:block;height:100%;width:100%;background:var(--sky)}
@media (orientation:portrait){ #ctl{height:196px} }
#ov{position:absolute;inset:0;background:rgba(4,14,10,.86);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
#ov[hidden]{display:none}
#ov .box{width:100%;max-width:420px;text-align:center}
.pk{display:flex;gap:8px;margin-top:14px}
.pk button{flex:1;padding:18px 0;font-family:var(--disp);font-weight:900;font-size:28px;border:3px solid var(--amber);background:transparent;border-radius:4px;color:var(--chalk)}
.pk button:active{background:var(--amber);color:var(--ink)}
.tip{font-size:13.5px;color:var(--mut);margin:10px 0}
.tip b{color:var(--chalk)}
@media (prefers-reduced-motion: reduce){#banner.on,#toast.on,#bF.rdy{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<div id="modal" hidden></div>
<div id="snack"></div>

<div id="match" hidden>
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="t"><i id="hc0" class="shp s-circle"></i><b id="hn0"></b></div>
    <div class="m"><div id="hs">0 - 0</div><div id="hk">0'</div></div>
    <div class="t r"><b id="hn1"></b><i id="hc1" class="shp"></i></div>
    <button id="hp" aria-label="Pause">II</button>
  </div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="ctl">
    <div id="stam"><i></i></div>
    <div id="joy"><div id="knob"></div></div>
    <button class="gb" id="bF">FIRE</button>
    <button class="gb" id="bS">SPRINT</button>
    <button class="gb" id="bB"></button>
    <button class="gb" id="bA"></button>
  </div>
  <div id="ov" hidden></div>
</div>

<script>
'use strict';
/* =========================================================
   UTIL
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const nf=s=>s/(s+70);                       // diminishing returns: lets stats grow forever
const pois=l=>{const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hash=s=>{let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const seasonLabel=n=>`${2025+n}/${String((26+n)%100).padStart(2,'0')}`;
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const cdist=(a,b)=>{const x=rgb(a),y=rgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
const lum=h=>{const c=rgb(h);return .3*c[0]+.59*c[1]+.11*c[2]};

/* =========================================================
   DATA – 350+ real clubs across 21 leagues
   ========================================================= */
const LG=[
{n:'Premier League',cc:'ENG',top:90,bot:74,s:[3,2,1],t:'Arsenal|Manchester City|Liverpool|Chelsea|Tottenham Hotspur|Newcastle United|Manchester United|Aston Villa|Brighton|Crystal Palace|West Ham United|Fulham|Bournemouth|Brentford|Everton|Nottingham Forest|Wolverhampton|Leeds United|Sunderland|Burnley'},
{n:'La Liga',cc:'ESP',top:90,bot:72,s:[3,2,1],t:'Real Madrid|Barcelona|Atlético Madrid|Athletic Club|Villarreal|Real Sociedad|Real Betis|Sevilla|Valencia|Girona|Celta Vigo|Osasuna|Getafe|Mallorca|Rayo Vallecano|Espanyol|Alavés|Elche|Levante|Real Oviedo'},
{n:'Bundesliga',cc:'GER',top:89,bot:70,s:[2,2,1],t:'Bayern Munich|Bayer Leverkusen|Borussia Dortmund|RB Leipzig|VfB Stuttgart|Eintracht Frankfurt|Borussia Mönchengladbach|Wolfsburg|Freiburg|Hoffenheim|Werder Bremen|Mainz 05|Union Berlin|Augsburg|FC Köln|FC St. Pauli|Hamburger SV|Heidenheim'},
{n:'Serie A',cc:'ITA',top:87,bot:70,s:[2,2,1],t:'Inter|Napoli|AC Milan|Juventus|Atalanta|Roma|Lazio|Fiorentina|Bologna|Como|Torino|Udinese|Genoa|Cagliari|Parma|Sassuolo|Lecce|Hellas Verona|Pisa|Cremonese'},
{n:'Ligue 1',cc:'FRA',top:86,bot:68,s:[1,2,1],t:'Paris Saint-Germain|Monaco|Marseille|Lille|Lyon|Nice|Lens|Rennes|Strasbourg|Toulouse|Brest|Nantes|Auxerre|Le Havre|Angers|Lorient|Metz|Paris FC'},
{n:'Eredivisie',cc:'NED',top:80,bot:64,s:[1,1,1],t:'PSV Eindhoven|Ajax|Feyenoord|AZ Alkmaar|FC Twente|FC Utrecht|Heerenveen|Go Ahead Eagles|Sparta Rotterdam|NEC Nijmegen|FC Groningen|Fortuna Sittard|PEC Zwolle|Heracles|NAC Breda|Willem II|Excelsior|Telstar'},

{n:'Süper Lig',cc:'TUR',top:78,bot:62,s:[1,1,0],t:'Galatasaray|Fenerbahçe|Beşiktaş|Trabzonspor|İstanbul Başakşehir|Samsunspor|Göztepe|Konyaspor|Kasımpaşa|Çaykur Rizespor|Alanyaspor|Antalyaspor|Gaziantep FK|Eyüpspor|Kayserispor|Kocaelispor|Gençlerbirliği|Fatih Karagümrük'},

{n:'Greek Super League',cc:'GRE',top:74,bot:56,s:[0,1,1],t:'Olympiacos|Panathinaikos|AEK Athens|PAOK|Aris|OFI Crete|Volos|Asteras Tripolis|Atromitos|Levadiakos|Panserraikos|Lamia|Kifisia|AEL Larissa'},
{n:'Austrian Bundesliga',cc:'AUT',top:72,bot:56,s:[0,0,2],t:'Red Bull Salzburg|Sturm Graz|Rapid Wien|LASK|Austria Wien|Wolfsberger AC|TSV Hartberg|Altach|Blau-Weiß Linz|Grazer AK|WSG Tirol|Ried'},

/* ---------- league engine ---------- */
function makeRounds(ids){
  const a=ids.slice();if(a.length%2)a.push(-1);
  const n=a.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const m=[];
    for(let i=0;i<n/2;i++){
      let h=a[i],b=a[n-1-i];
      if(h<0||b<0)continue;
      if((r+i)%2)[h,b]=[b,h];
      m.push([h,b]);
    }
    rounds.push(m);a.splice(1,0,a.pop());
  }
  return shuffle(rounds);
}
const initTbl=ids=>{const t={};ids.forEach(i=>t[i]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});return t};
function rec(tbl,h,a,hg,ag){
  const A=tbl[h],B=tbl[a];A.p++;B.p++;A.gf+=hg;A.ga+=ag;B.gf+=ag;B.ga+=hg;
  if(hg>ag){A.w++;A.pts+=3;B.l++}else if(hg<ag){B.w++;B.pts+=3;A.l++}else{A.d++;B.d++;A.pts++;B.pts++}
}
const sortTbl=tbl=>Object.keys(tbl).map(Number).sort((a,b)=>{const x=tbl[a],y=tbl[b];return y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||T[b].r-T[a].r});
function simMatch(h,a,neutral){
  const d=eff(h)-eff(a)+(neutral?0:3);
  return [pois(1.35*Math.exp(d/30)),pois(1.1*Math.exp(-d/30))];
}
function pensAI(h,a){
  const w=Math.random()<clamp(.5+(eff(h)-eff(a))/160,.2,.8);
  const lo=ri(2,4),hi=lo+ri(1,2);
  return w?[hi,lo]:[lo,hi];
}

/* ---------- continental competitions ---------- */
function buildComps(){
  G.comps={};G.mc=null;
  KEYS.forEach((k,ki)=>{
    const parts=[];
    LG.forEach((l,li)=>{
      const sl=l.s;let off=0;for(let j=0;j<ki;j++)off+=sl[j];
      const n=sl[ki];if(!n)return;
      T.filter(t=>t.lg===li).forEach(t=>{const p=G.lp[t.id];if(p>off&&p<=off+n)parts.push(t.id)});
    });
    const sorted=parts.slice().sort((a,b)=>T[b].r-T[a].r);
    const pots=[0,1,2,3].map(i=>shuffle(sorted.slice(i*4,i*4+4)));
    const groups=[0,1,2,3].map(g=>pots.map(p=>p[g]).filter(x=>x!==undefined));
    const pat=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
    const fx=pat.map((rd,r)=>{const o=[];groups.forEach((gr,g)=>rd.forEach(([x,y])=>{let h=gr[x],a=gr[y];if((r+g)%2)[h,a]=[a,h];o.push({g,h,a})}));return o});
    const c={k,name:CNAME[k],parts,groups,gt:groups.map(gr=>initTbl(gr)),fx,prepped:-1,cur:[],hist:[],out:{},q:null,champ:null};
    G.comps[k]=c;
    if(parts.includes(G.team))G.mc=k;
  });
}
function prep(c,s){
  if(c.prepped===s)return;c.prepped=s;
  if(s<3)c.cur=c.fx[s].map(m=>({...m}));
  else if(s===3){const q=c.q;c.cur=[[q[0][0],q[1][1]],[q[1][0],q[0][1]],[q[2][0],q[3][1]],[q[3][0],q[2][1]]].map(([h,a])=>({h,a}))}
  else{const w=c.hist[s-1].map(m=>m.w);c.cur=s===4?[{h:w[0],a:w[1]},{h:w[2],a:w[3]}]:[{h:w[0],a:w[1]}]}
}
function resolve(c,s,res){
  for(const m of c.cur){
    const mine=res&&(m.h===G.team||m.a===G.team);
    let hg,ag,pen=null;
    if(mine){hg=m.h===G.team?res.my:res.opp;ag=m.h===G.team?res.opp:res.my;if(res.pen)pen=m.h===G.team?res.pen:[res.pen[1],res.pen[0]]}
    else[hg,ag]=simMatch(m.h,m.a,s===5);
    m.hg=hg;m.ag=ag;
    if(s<3)rec(c.gt[m.g],m.h,m.a,hg,ag);
    else{
      if(hg===ag&&!pen)pen=pensAI(m.h,m.a);
      m.pen=pen;m.w=(hg>ag||(hg===ag&&pen[0]>pen[1]))?m.h:m.a;
      c.out[m.w===m.h?m.a:m.h]=s;
    }
  }
  if(s===2)c.q=c.gt.map(t=>sortTbl(t).slice(0,2));
  c.hist[s]=c.cur;
  if(s===5)c.champ=c.cur[0].w;
}
function compResult(c){
  if(!c.parts.includes(G.team))return null;
  if(c.champ===G.team)return 'Champions';
  const o=c.out[G.team];
  if(o===5)return 'Runners-up';if(o===4)return 'Semi-finals';if(o===3)return 'Quarter-finals';return 'Group stage';
}

/* ---------- season flow ---------- */
function freshPositions(){
  G.lp={};
  LG.forEach((l,li)=>{
    T.filter(t=>t.lg===li).map(t=>({id:t.id,v:t.r+rnd(-3,3)})).sort((a,b)=>b.v-a.v).forEach((o,i)=>G.lp[o.id]=i+1);
  });
}
function newSeason(){
  const me=myT();
  const ids=T.filter(t=>t.lg===me.lg).map(t=>t.id);
  G.L={rounds:makeRounds(ids),tbl:initTbl(ids),md:0};
  buildComps();
  const N=G.L.rounds.length,fr=[.2,.34,.48,.62,.78,1],evs=[];
  const at=fr.map(f=>Math.ceil(f*N)-1);
  for(let k=0;k<N;k++){
    evs.push({t:'L',i:k});
    at.forEach((p,s)=>{if(p===k)evs.push({t:'C',s})});
  }
  G.evs=evs;G.ei=0;G.phase='season';G.res=[];G.sum=null;
  G.ss={apps:0,g:0,a:0,rs:0,w:0,d:0,l:0};
  G.enq={};
  autoAdvance();
}
function myMatch(ev){
  if(ev.t==='L'){
    const m=G.L.rounds[ev.i].find(x=>x[0]===G.team||x[1]===G.team);
    return m?{h:m[0],a:m[1]}:null;
  }
  const c=G.comps[G.mc];if(!c)return null;
  prep(c,ev.s);
  const m=c.cur.find(x=>x.h===G.team||x.a===G.team);
  return m?{h:m.h,a:m.a}:null;
}
function processEvent(ev,res){
  if(ev.t==='L'){
    for(const m of G.L.rounds[ev.i]){
      const[h,a]=m;let hg,ag;
      if(res&&(h===G.team||a===G.team)){hg=h===G.team?res.my:res.opp;ag=h===G.team?res.opp:res.my}
      else[hg,ag]=simMatch(h,a);
      rec(G.L.tbl,h,a,hg,ag);
    }
    G.L.md++;
    if(ev.i===Math.floor(G.L.rounds.length/2)-1)genOffers(true);
  }else{
    KEYS.forEach(k=>{const c=G.comps[k];prep(c,ev.s);resolve(c,ev.s,k===G.mc?res:null)});
  }
  G.ei++;
}
function autoAdvance(){
  while(G.ei<G.evs.length){
    const ev=G.evs[G.ei];
    if(myMatch(ev))break;
    processEvent(ev,null);
  }
  if(G.ei>=G.evs.length&&G.phase==='season')endSeason();
}
function nextInfo(){
  const ev=G.evs[G.ei];if(!ev)return null;
  const m=myMatch(ev);if(!m)return null;
  const home=m.h===G.team,opp=home?m.a:m.h;
  if(ev.t==='L')return{ev,opp,home,ko:false,neutral:false,label:`${LG[myT().lg].n} · Matchday ${ev.i+1}/${G.L.rounds.length}`};
  const c=G.comps[G.mc];
  return{ev,opp,home,ko:ev.s>=3,neutral:ev.s===5,label:`${c.name} · ${STAGES[ev.s]}`};
}
function endSeason(){
  const me=myT(),order=sortTbl(G.L.tbl),myPos=order.indexOf(G.team)+1;
  const champs=[];
  LG.forEach((l,li)=>{
    const ids=T.filter(t=>t.lg===li).map(t=>t.id);
    let ord;
    if(li===me.lg)ord=order;
    else{const tb=initTbl(ids);makeRounds(ids).forEach(r=>r.forEach(([h,a])=>{const[x,y]=simMatch(h,a);rec(tb,h,a,x,y)}));ord=sortTbl(tb)}
    ord.forEach((id,i)=>G.lp[id]=i+1);
    if(li<8||li===me.lg)champs.push({lg:l.n,id:ord[0]});
  });
  const cr=G.mc?compResult(G.comps[G.mc]):null;
  const cch=KEYS.map(k=>({k:CNAME[k],id:G.comps[k].champ}));
  const trophies=[];
  if(myPos===1)trophies.push(`${LG[me.lg].n} ${seasonLabel(G.season)}`);
  if(cr==='Champions')trophies.push(`${CNAME[G.mc]} ${seasonLabel(G.season)}`);
  G.trophies.push(...trophies);
  const ss=G.ss;
  G.history.push({season:G.season,team:G.team,pos:myPos,n:order.length,cr,mk:G.mc,apps:ss.apps,g:ss.g,a:ss.a,avg:ss.apps?ss.rs/ss.apps:0,ovr:ovrOf()});
  G.tot.apps+=ss.apps;G.tot.g+=ss.g;G.tot.a+=ss.a;
  const train=8;G.pts+=train;
  let decline='';
  G.age++;
  if(G.age>=33){G.stats.pace=Math.max(20,G.stats.pace-2);G.stats.phy=Math.max(20,G.stats.phy-1);G.stats.dri=Math.max(20,G.stats.dri-1);decline='Age is catching up: −2 PAC, −1 PHY, −1 DRI.'}
  T.forEach(t=>{const p=G.lp[t.id],n=T.filter(x=>x.lg===t.lg).length;t.r=clamp(t.r+rnd(-1.4,1.4)+(p===1?1:0)-(p===n?.8:0),42,94)});
  G.sum={season:G.season,pos:myPos,n:order.length,cr,mk:G.mc,champs,cch,trophies,train,decline,ss:{...ss}};
  G.phase='off';
  genOffers(false);
  save();
}
function nextSeason(){
  if(G.pending!=null){G.team=G.pending;G.pending=null}
  G.season++;
  if(G.age>=38){G.over=true;save();render();return}

const marketVal=()=>{const ss=G.ss||{apps:0,rs:0};const avg=ss.apps?ss.rs/ss.apps:6.5;return ovrOf()+10+(avg-6.5)*4};
const wageOf=t=>Math.round(((t.r-48)**2*.22+2)*10)/10;   // £k / week flavour
function genOffers(winter){
  const val=marketVal(),cur=myT();
  const keep=(G.offers||[]).filter(o=>o.id!==G.team);
  const cand=T.filter(t=>t.id!==G.team&&t.r<=val+3&&t.r>=val-14&&t.r>cur.r-6&&!keep.some(o=>o.id===t.id));
  shuffle(cand);
  const n=winter?ri(0,2):ri(1,3);
  const got=cand.slice(0,n).map(t=>({id:t.id,wage:wageOf(t),years:ri(2,5),bonus:2+Math.max(0,Math.round(t.r-cur.r)),winter}));
  G.offers=keep.concat(got);
  if(winter&&got.length)G.news=`Scouts were watching: ${got.length} club${got.length>1?'s':''} showed interest.`;
}
function interest(t){const d=marketVal()-t.r;return d>=2?['High',.9]:d>=-3?['Medium',.6]:d>=-8?['Low',.25]:['None',.02]}

/* ----- actions ----- */
function upgrade(k,d){
  const n=d==='max'?G.pts:Math.min(G.pts,+d);
  if(n<=0)return;G.stats[k]+=n;G.pts-=n;save();render();
}
function accept(i){
  const o=G.offers[i];if(!o)return;
  G.pending=o.id;G.pts+=o.bonus;G.offers=G.offers.filter((_,j)=>j!==i);
  snack(`Move to ${T[o.id].name} agreed (+${o.bonus} points)`);save();render();
}
function enquire(id){
  const t=T[id];if(G.enq[id])return;
  G.enq[id]=1;
  const[lab,p]=interest(t);
  if(Math.random()<p){
    const bonus=2+Math.max(0,Math.round(t.r-myT().r));
    G.pending=id;G.pts+=bonus;snack(`${t.name} agreed! (+${bonus} points)`);
  }else snack(`${t.name} turned you down. Keep improving.`);
  save();render();
}
function simSeasonRest(){
  let guard=0;
  while(G.phase==='season'&&guard++<80){
    const ni=nextInfo();if(!ni)break;
    const res=simMine(ni);finishResult(ni,res,true);
  }
}

/* =========================================================
   RESULTS / POINTS
   ========================================================= */
function simMine(ni){
  const m=G.team,o=ni.opp;
  const h=ni.home?m:o,a=ni.home?o:m;
  const[hg,ag]=simMatch(h,a,ni.neutral);
  const my=ni.home?hg:ag,op=ni.home?ag:hg;
  const role=G.role;
  const sg={ST:.38,CM:.12,CB:.04}[role]*(.6+nf(G.stats.sho)),sa={ST:.12,CM:.3,CB:.08}[role]*(.6+nf(G.stats.pas));
  let g=0,as=0;for(let i=0;i<my;i++){if(Math.random()<sg)g++;else if(Math.random()<sa)as++}
  const rating=clamp(6.3+rnd(-.5,.8)+(my>op?.5:my<op?-.4:0)+g*.9+as*.6,4,9.8);
  return{my,opp:op,goals:g,assists:as,tackles:0,passOK:0,passAtt:0,shots:g,rating,sim:true};
}
function ptsFor(r,ni){
  let p=r.my>r.opp?3:r.my===r.opp?1.5:.5;
  p+=r.goals*1.5+r.assists+(r.rating>=8?2:r.rating>=7.2?1:0);
  if(G.role==='CB'&&r.opp===0)p+=1;
  if(ni.ko)p*=1.2;
  if(r.sim)p*=.6;
  return Math.max(1,Math.round(p));
}
function finishResult(ni,res,silent){
  if(ni.ko&&res.my===res.opp&&!res.pen){const w=Math.random()<clamp(.5+(eff(G.team)-eff(ni.opp))/160,.2,.8);res.pen=w?[ri(4,5),ri(2,3)]:[ri(2,3),ri(4,5)]}
  const pts=ptsFor(res,ni);res.pts=pts;G.pts+=pts;
  const ss=G.ss;ss.apps++;ss.g+=res.goals;ss.a+=res.assists;ss.rs+=res.rating;
  const won=res.my>res.opp||(res.my===res.opp&&res.pen&&res.pen[0]>res.pen[1]);
  if(res.my>res.opp)ss.w++;else if(res.my<res.opp)ss.l++;else ss.d++;
  G.res.push({name:`${ni.ev.t==='L'?'League':CONT.find(c=>c[0]===G.mc)[0]} · ${T[ni.opp].name}`,my:res.my,opp:res.opp,pen:res.pen,sim:res.sim});
  if(G.res.length>20)G.res.shift();
  processEvent(ni.ev,res);
  G.news='';
  autoAdvance();
  save();
  if(!silent)showResult(ni,res,won);
}
function showResult(ni,res,won){
  const me=myT(),o=T[ni.opp];
  const out=res.my>res.opp?'Victory':res.my<res.opp?'Defeat':res.pen?(won?'Won on penalties':'Lost on penalties'):'Draw';
  modal(`<div class="mut small" style="text-align:center">${esc(ni.label)}</div>
  <div class="fx" style="margin-bottom:0">${dot(me,'lg')}<div class="score">${res.my} – ${res.opp}</div>${badge(o,false,'lg')}</div>
  <div style="text-align:center;font-family:var(--disp);font-weight:800;font-size:26px;color:${won||res.my===res.opp?'var(--amber)':'var(--coral)'}">${out}${res.pen?` (${res.pen[0]}–${res.pen[1]})`:''}</div>
  <div class="card" style="margin-top:12px"><div class="row sp"><span>Your rating</span><b style="font-size:20px">${res.rating.toFixed(1)}</b></div>
  <div class="row sp small mut" style="margin-top:6px"><span>Goals ${res.goals} · Assists ${res.assists}${res.sim?'':` · Tackles ${res.tackles}`}</span>${res.sim?'<span>Simulated</span>':`<span>Passes ${res.passOK}/${res.passAtt}</span>`}</div></div>
  <div class="card row sp" style="border-color:var(--amber)"><span>Attribute points earned</span><b style="font-size:26px;color:var(--amber)">+${res.pts}</b></div>
  <div class="row"><button class="btn pri" style="flex:1" data-a="closeres">Continue</button><button class="btn" style="flex:1" data-a="toplayer">Spend points</button></div>`);
}

/* =========================================================
   MATCH ENGINE
   ========================================================= */
const MW=1000,MH=600,GOALW=170,GY1=(MH-GOALW)/2,GY2=GY1+GOALW,MATCH_SEC=80;
const cv=$('#cv'),cx=cv.getContext('2d');
const view={s:1,por:false,ox:0,oy:0,dpr:1,w:0,h:0};
let M=null,raf=0,lastT=0;
const jv={x:0,y:0},keys=new Set();
const FORM=[['GK',.05,.5],['DEF',.2,.3],['DEF',.2,.72],['MID',.42,.27],['MID',.42,.73],['FWD',.6,.5]];
const SLOT={CB:1,CM:3,ST:5};
const BTN={CB:['TACKLE','PASS'],CM:['PASS','SHOOT'],ST:['SHOOT','PASS']};
const BACT={CB:['tackle','pass'],CM:['pass','shoot'],ST:['shoot','pass']};

function layout(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=innerWidth,h=innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  view.dpr=dpr;view.w=w;view.h=h;view.por=h>w*1.05;
  const top=64+(parseInt(getComputedStyle(document.documentElement).paddingTop)||0);
  if(view.por){
    const ctl=190,s=Math.min(w/MH,(h-top-ctl)/MW);
    view.s=s;view.ox=(w-MH*s)/2;view.oy=top+(h-top-ctl-MW*s)/2;
  }else{
    const s=Math.min(w/MW,(h-top-8)/MH);
    view.s=s;view.ox=(w-MW*s)/2;view.oy=top+(h-top-MH*s)/2;
  }
}
function applyT(){
  const{s,dpr,ox,oy}=view;
  if(view.por)cx.setTransform(0,-s*dpr,s*dpr,0,ox*dpr,(oy+MW*s)*dpr);
  else cx.setTransform(s*dpr,0,0,s*dpr,ox*dpr,oy*dpr);
}
const toScr=(x,y)=>view.por?[view.ox+y*view.s,view.oy+(MW-x)*view.s]:[view.ox+x*view.s,view.oy+y*view.s];
function joyWorld(){return view.por?{x:-jv.y,y:jv.x}:{x:jv.x,y:jv.y}}
addEventListener('resize',()=>{if(M)layout()});

/* ----- shapes ----- */
function shapePath(c,s,r){
  c.beginPath();
  if(s==='circle'){c.arc(0,0,r,0,Math.PI*2);return}
  if(s==='sq'){c.rect(-r*.88,-r*.88,r*1.76,r*1.76);return}
  let n,rot=0,rr=r,star=false;
  if(s==='tri'){n=3;rot=-Math.PI/2;rr=r*1.25}
  else if(s==='dia'){n=4;rr=r*1.2}
  else if(s==='hex'){n=6;rr=r*1.08}
  else if(s==='oct'){n=8;rot=Math.PI/8;rr=r*1.05}
  else{n=10;rot=-Math.PI/2;star=true;rr=r*1.35}
  for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n,k=star&&i%2?.5:1;const x=Math.cos(a)*rr*k,y=Math.sin(a)*rr*k;i?c.lineTo(x,y):c.moveTo(x,y)}
  c.closePath();
}

/* ----- match setup ----- */
function mkTeam(team,rating){
  return FORM.map(([role,fx,fy],i)=>({team,role,i,hx:fx,hy:fy,x:0,y:0,vx:0,vy:0,r:role==='GK'?17:13,face:team?Math.PI:0,cd:0,np:0,stun:0,think:rnd(0,.4),boost:0,rocket:0,frozen:0,giant:0,human:false,st:rating,slide:0,hold:0,rolled:0,blk:0,sta:100,tired:false,recvFrom:null,recvT:-9}));
}
function startMatch(ni){
  const me=myT(),op=T[ni.opp];
  let opc=op.col;if(cdist(me.col,opc)<125)opc=lum(me.col)>150?'#16181d':'#f2f2f2';
  M={ni,me,op,myc:me.col,opc,opShape:op.shape,
    pl:[...mkTeam(0,me.r),...mkTeam(1,op.r)],
    ball:{x:MW/2,y:MH/2,vx:0,vy:0,r:7,owner:null,lastK:null,lastTeam:0,shot:null,passT:0},
    phase:'pre',cnt:0,gt:0,kick:1,min:0,score:[0,0],pu:null,puT:rnd(9,13),parts:[],sid:0,htDone:false,paused:false,
    S:{goals:0,assists:0,tackles:0,passAtt:0,passOK:0,shots:0,on:0,sav:0},
    fire:0,fireT:0,callT:0,t:0,flash:0,flashTeam:0,
    penMin:Math.random()<.5?ri(20,80):999,penDone:false,end:false,press:[[],[]],chase:[null,null]};
  const hum=M.pl[SLOT[G.role]];hum.human=true;hum.st=0;M.hum=hum;
  lineup(1);
  layout();
  $('#hn0').textContent=me.name;$('#hn1').textContent=op.name;
  $('#hc0').style.background=me.col;
  const h1=$('#hc1');h1.className='shp s-'+op.shape;h1.style.background=opc;
  $('#hc0').className='shp s-circle';
  const lab=BTN[G.role];$('#bA').textContent=lab[0];$('#bB').textContent=lab[1];
  $('#match').hidden=false;
  banner('');
  const ov=$('#ov');ov.hidden=false;
  const tips={CB:'<b>Tackle</b> to lunge at the ball carrier (miss and you stumble). <b>Pass</b> picks a teammate in the direction you push; with no ball it calls for a pass.',
    CM:'<b>Pass</b> finds a teammate in the direction you push; with no ball it calls for one. <b>Shoot</b> aims at the goal, push up or down to pick a corner.',
    ST:'<b>Shoot</b> aims at the goal, push up or down to pick a corner. <b>Pass</b> lays it off; with no ball it calls for a pass.'}[G.role];
  ov.innerHTML=`<div class="box"><div class="mut small">${esc(ni.label)}</div>
   <div class="fx" style="margin:14px 0">${dot(me,'xl')}<span class="vs">${ni.home?'vs':'at'}</span><i class="shp xl s-${op.shape}" style="background:${opc}"></i></div>
   <h2 style="font-size:30px">${esc(me.name)} v ${esc(op.name)}</h2>
   <div class="tip">${tips}<br><br><b>Sprint</b> drains stamina. Grab glowing orbs for turbo, rocket shots, freeze or a giant keeper. Fill the <b>fire</b> meter for a burst of unstoppable play.</div>
   <button class="btn pri full" id="ko">Kick off</button><button class="btn full" style="margin-top:8px" id="kb">Back</button></div>`;
  $('#ko').onclick=()=>{ov.hidden=true;M.phase='count';M.cnt=1.6;banner('GET READY');runLoop()};
  $('#kb').onclick=()=>{ov.hidden=true;$('#match').hidden=true;M=null;render()};
  draw();
}
function lineup(kickTeam){
  const b=M.ball;
  for(const p of M.pl){
    const fx=Math.min(p.hx,.44);
    p.x=p.team?MW-fx*MW:fx*MW;p.y=p.hy*MH;p.vx=p.vy=0;p.stun=0;p.slide=0;p.frozen=0;p.cd=0;p.np=0;
    p.face=p.team?Math.PI:0;
  }
  const f=M.pl.find(p=>p.team===kickTeam&&p.role==='FWD');
  f.x=MW/2+(kickTeam?18:-18);f.y=MH/2;
  b.owner=f;b.x=MW/2;b.y=MH/2;b.vx=b.vy=0;b.shot=null;b.lastK=f;b.lastTeam=kickTeam;
  M.press=[[],[]];
}

/* ----- feedback ----- */
function banner(t,sub){const b=$('#banner');b.classList.remove('on');if(!t)return;b.innerHTML=t+(sub?`<small>${sub}</small>`:'');void b.offsetWidth;b.classList.add('on')}
function toast(t,col){const e=$('#toast');e.classList.remove('on');e.style.color=col||'#fff';e.textContent=t;void e.offsetWidth;e.classList.add('on')}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=rnd(.3,1)*sp;M.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,.9),m:.9,c:col,s:rnd(2,4.5)})}}
function addFire(n){if(M.fireT>0)return;M.fire=Math.min(100,M.fire+n)}

/* ----- ball actions ----- */
function takeBall(p){
  const b=M.ball;
  if(b.lastK&&b.lastK!==p&&b.lastK.team===p.team){p.recvFrom=b.lastK;p.recvT=M.t;if(b.lastK.human){M.S.passOK++;addFire(8);if(p.role==='FWD'||p.role==='MID')toast('NICE PASS!','#ffc933')}}
  if(p.human&&b.lastTeam!==0&&b.lastK&&b.lastK.team===1){addFire(10);}
  b.owner=p;b.vx=b.vy=0;b.shot=null;b.lastTeam=p.team;
}
function kick(p,ang,spd,type,q){
  const b=M.ball;
  b.owner=null;
  b.x=p.x+Math.cos(ang)*(p.r+b.r+2);b.y=p.y+Math.sin(ang)*(p.r+b.r+2);
  b.vx=Math.cos(ang)*spd;b.vy=Math.sin(ang)*spd;
  b.lastK=p;b.lastTeam=p.team;p.np=.3;p.cd=Math.max(p.cd,.2);
  if(type==='shot'){
    const as=(p.recvFrom&&M.t-p.recvT<5)?p.recvFrom:null;
    b.shot={team:p.team,q,id:++M.sid,assist:as,by:p};
  }else b.shot=null;
  burst(b.x,b.y,'#ffffff',4,90);
}
function passTargets(p,allowGK){
  return M.pl.filter(q=>q.team===p.team&&q!==p&&(allowGK||q.role!=='GK'));
}
function laneBlocked(p,q){
  const dx=q.x-p.x,dy=q.y-p.y,L2=dx*dx+dy*dy||1;
  for(const f of M.pl){
    if(f.team===p.team)continue;
    const t=clamp(((f.x-p.x)*dx+(f.y-p.y)*dy)/L2,0,1);
    if(Math.hypot(p.x+dx*t-f.x,p.y+dy*t-f.y)<(f.role==='GK'?20:30))return true;
  }
  return false;
}
function leadPos(q,d){const t=d/520*.8;return[clamp(q.x+q.vx*t,20,MW-20),clamp(q.y+q.vy*t,20,MH-20)]}
function aiPass(p,q){
  const[tx,ty]=leadPos(q,D(p,q));
  const err=(1-nf(p.st))*.22*(Math.random()*2-1);
  kick(p,Math.atan2(ty-p.y,tx-p.x)+err,430+Math.min(120,D(p,q)*.25),'pass');
}
function aiPassTarget(p,allowGK){
  const dir=p.team?-1:1;let best=null,bs=-1e9;
  for(const q of passTargets(p,allowGK)){
    const d=D(p,q);if(d<60||d>540)continue;
    let sc=(q.x-p.x)*dir*.8-d*.2;
    if(laneBlocked(p,q))sc-=300;
    for(const f of M.pl)if(f.team!==p.team&&f.role!=='GK'&&D(f,q)<55)sc-=70;
    if(q.human)sc+=40;
    if(sc>bs){bs=sc;best=q}
  }
  return bs>-120?best:null;
}
function aiShoot(p){
  const gx=p.team?0:MW,gk=M.pl.find(q=>q.team!==p.team&&q.role==='GK');
  const side=gk.y>MH/2?-1:1;
  const ty=MH/2+side*rnd(22,64);
  const d=Math.hypot(gx-p.x,ty-p.y);
  let err=(1-nf(p.st*.95))*.34*(.7+d/700)*(Math.random()*2-1);
  if(p.rocket>0){err*=.2;p.rocket=0}
  const q=nf(p.st)+(p.boost>0?.05:0);
  kick(p,Math.atan2(ty-p.y,gx-p.x)+err,720+120*q,'shot',q);
  M.stShots=(M.stShots||0)+1;
}

/* ----- tackles ----- */
function tryTackle(t,c,mult){
  const ts=t.human?G.stats.def:t.st,cs=c.human?G.stats.dri:c.st;
  let ch=(.42+(nf(ts)-nf(cs))*1.1)*mult;
  if(t.human&&M.fireT>0)ch=1;
  if(c.human&&M.fireT>0)ch*=.5;
  ch=clamp(ch,.08,.92);
  t.cd=.9;
  if(Math.random()<ch){
    takeBall(t);t.slide=0;
    c.stun=.55;c.np=.7;burst(c.x,c.y,'#ffffff',8,140);
    if(t.human){M.S.tackles++;addFire(15);toast('TACKLE WON!','#6fd3ff')}
    else if(c.human)toast('Dispossessed!','#ff6a57');
    return true;
  }
  t.stun=t.human?.4:.55;
  if(t.human)toast('Missed!','#ff6a57');
  return false;
}

/* ----- human controls ----- */
function readInput(){
  let x=0,y=0;
  if(keys.has('arrowleft')||keys.has('a'))x-=1;
  if(keys.has('arrowright')||keys.has('d'))x+=1;
  if(keys.has('arrowup')||keys.has('w'))y-=1;
  if(keys.has('arrowdown')||keys.has('s'))y+=1;
  let v;
  if(x||y){const m=Math.hypot(x,y);v={x:x/m,y:y/m};jv.x=v.x;jv.y=v.y;return view.por?{x:-v.y,y:v.x}:v}
  return joyWorld();
}
const act={pA:false,pB:false,fire:false,sp:false};
function doAction(kind,p){
  if(kind==='tackle')humanTackle(p);
  else if(kind==='pass')humanPass(p);
  else if(kind==='shoot')humanShoot(p);
}
function humanTackle(p){
  if(p.cd>0||p.slide>0||p.stun>0)return;
  const car=M.ball.owner;
  let ang=p.face;
  if(car&&car.team===1&&D(p,car)<150)ang=Math.atan2(car.y-p.y,car.x-p.x);
  else if(!car){const b=M.ball;if(D(p,b)<120)ang=Math.atan2(b.y-p.y,b.x-p.x)}
  p.slide=.3;p.sdx=Math.cos(ang);p.sdy=Math.sin(ang);p.cd=1;p.face=ang;
  p.vx=p.sdx*360;p.vy=p.sdy*360;
}
function humanPass(p){
  const b=M.ball;
  const has=b.owner===p,near=!b.owner&&D(p,b)<p.r+b.r+22;
  if(!has&&!near){M.callT=1.1;toast('Calling for it...','#ffffff');return}
  const inp=readInput(),mg=Math.hypot(inp.x,inp.y);
  let ax,ay;if(mg<.25){ax=Math.cos(p.face);ay=Math.sin(p.face)}else{ax=inp.x/mg;ay=inp.y/mg}
  let best=null,bs=-1e9;
  for(const q of passTargets(p,false)){
    const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<45)continue;
    const c=(dx*ax+dy*ay)/d;if(c<.62)continue;
    const sc=c*3-d/420+(laneBlocked(p,q)?-1.2:0);
    if(sc>bs){bs=sc;best=q}
  }
  M.S.passAtt++;
  const err=M.fireT>0?0:(1-nf(G.stats.pas))*.2*(Math.random()*2-1);
  if(best){
    const[tx,ty]=leadPos(best,D(p,best));
    kick(p,Math.atan2(ty-p.y,tx-p.x)+err,450+Math.min(130,D(p,best)*.3)+(M.fireT>0?60:0),'pass');
  }else kick(p,Math.atan2(ay,ax)+err*1.5,520,'pass');
}
function humanShoot(p){
  const b=M.ball;
  const has=b.owner===p,near=!b.owner&&D(p,b)<p.r+b.r+18;
  if(!has&&!near)return;
  const inp=readInput(),gx=MW;
  let ty;
  if(Math.abs(inp.y)>.3)ty=MH/2+clamp(inp.y,-1,1)*(GOALW/2-20);
  else ty=MH/2+(Math.random()<.5?-1:1)*rnd(8,46);
  const d=Math.hypot(gx-p.x,ty-p.y);
  const sq=nf(G.stats.sho);
  let err=(1-sq)*.32*(.7+d/700)*(Math.random()*2-1);
  let pw=1;
  if(M.fireT>0){err*=.1;pw*=1.15}
  if(p.rocket>0){err*=.2;pw*=1.25;p.rocket=0}
  const ang=Math.atan2(ty-p.y,gx-p.x)+err;
  const tg=(gx-p.x)/Math.cos(ang);const yy=p.y+Math.sin(ang)*tg;
  M.S.shots++;if(yy>GY1&&yy<GY2)M.S.on++;
  kick(p,ang,(760+260*sq)*pw,'shot',clamp(sq+(pw>1?.18:0),.1,.98));
  toast(d<260?'':'',null);
}
function humanUpdate(p,dt){
  const inp=readInput(),mg=Math.min(1,Math.hypot(inp.x,inp.y));
  const sprint=act.sp&&mg>.2&&!p.tired;
  if(sprint)p.sta=Math.max(0,p.sta-34*dt);else p.sta=Math.min(100,p.sta+(mg>.1?10:24)*dt);
  if(p.sta<=0)p.tired=true;if(p.tired&&p.sta>=28)p.tired=false;
  let sp=150*(.82+.5*nf(G.stats.pace));
  if(sprint)sp*=1.35;if(p.boost>0)sp*=1.35;if(M.fireT>0)sp*=1.25;if(M.ball.owner===p)sp*=.95;if(M.min>80)sp*=1.06;
  if(p.slide>0){p.slide-=dt;p.vx=p.sdx*360*(p.slide/.3+.3);p.vy=p.sdy*360*(p.slide/.3+.3);
    const car=M.ball.owner;
    if(car&&car.team===1&&D(p,car)<p.r+car.r+16&&p.cd<=.92){if(tryTackle(p,car,1)){}p.slide=0}
    if(p.slide<=0&&M.ball.owner!==p)p.stun=Math.max(p.stun,.3);
    return;
  }
  if(mg>.12){const tx=Math.atan2(inp.y,inp.x);let d=tx-p.face;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;p.face+=d*(1-Math.exp(-14*dt))}
  accel(p,inp.x*sp,inp.y*sp,dt);
  if(act.pA){act.pA=false;doAction(BACT[G.role][0],p)}
  if(act.pB){act.pB=false;doAction(BACT[G.role][1],p)}
  if(act.fire){act.fire=false;if(M.fire>=100&&M.fireT<=0){M.fireT=9;M.fire=0;banner('ON FIRE!','9 seconds of pure class');burst(p.x,p.y,'#ff6a57',30,260)}}
  // CM/ST wrestle for the ball on contact
  const car=M.ball.owner;
  if(G.role!=='CB'&&car&&car.team===1&&p.cd<=0&&p.stun<=0&&D(p,car)<p.r+car.r+6)tryTackle(p,car,.55);
}

/* ----- physics helpers ----- */
function accel(p,dvx,dvy,dt){
  const a=1-Math.exp(-10*dt);
  p.vx+=(dvx-p.vx)*a;p.vy+=(dvy-p.vy)*a;
  if(p.stun>0){p.vx*=.5;p.vy*=.5}
}
function aiSpeed(p){
  const q=clamp((p.st-50)/45,.05,1);
  let s=150*(.85+.3*q);
  if(p.boost>0)s*=1.35;if(M.ball.owner===p)s*=.95;if(M.min>80)s*=1.06;
  return s;
}
function steer(p,tx,ty,sf,dt){
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),sp=aiSpeed(p)*sf;
  let vx=0,vy=0;
  if(d>5){const k=Math.min(1,d/40);vx=dx/d*sp*k;vy=dy/d*sp*k}
  accel(p,vx,vy,dt);
  if(Math.hypot(p.vx,p.vy)>25){const t=Math.atan2(p.vy,p.vx);let dd=t-p.face;while(dd>Math.PI)dd-=Math.PI*2;while(dd<-Math.PI)dd+=Math.PI*2;p.face+=dd*(1-Math.exp(-12*dt))}
}

/* ----- AI ----- */
function aiCarrier(p,dt){
  const me=p.team,gx=me?0:MW;
  p.think-=dt;
  if(me===0&&M.callT>0&&!M.hum.stun&&p.think<.25&&D(p,M.hum)>55){aiPass(p,M.hum);M.callT=0;return}
  let ax=gx-p.x,ay=MH/2-p.y;const L=Math.hypot(ax,ay)||1;ax/=L;ay/=L;
  for(const f of M.pl){
    if(f.team===me||f.role==='GK')continue;
    const dd=D(p,f);
    if(dd<115&&dd>1){const w=(115-dd)/115;ax+=(p.x-f.x)/dd*w*1.5;ay+=(p.y-f.y)/dd*w*1.5}
  }
  const m=Math.hypot(ax,ay)||1;
  steer(p,p.x+ax/m*100,p.y+ay/m*100,1,dt);
  if(p.think<=0){
    p.think=rnd(.3,.65);
    const dg=Math.abs(gx-p.x);
    const pressured=M.pl.some(f=>f.team!==me&&f.role!=='GK'&&D(f,p)<55);
    if(dg<330&&Math.random()<(dg<230?.8:.45)){aiShoot(p);return}
    const t=aiPassTarget(p,false);
    if(t&&(pressured||Math.random()<.4))aiPass(p,t);
  }
}
function gkAI(p,dt){
  const b=M.ball,own=p.team===0?0:MW,din=p.team===0?1:-1;
  p.think-=dt;
  if(b.owner===p){
    p.hold-=dt;steer(p,own+din*(p.r+30),MH/2,.5,dt);
    if(p.hold<=0){
      const t=aiPassTarget(p,false)||passTargets(p,false)[0];
      if(t)aiPass(p,t);else kick(p,p.team?Math.PI:0,520,'pass');
    }
    return;
  }
  const gx=own+din*(p.r+10);
  let tx=gx,ty=MH/2+(clamp(b.y,GY1+14,GY2-14)-MH/2)*.9,sf=.9;
  const sp=Math.hypot(b.vx,b.vy);
  if(!b.owner&&b.vx*din<-120&&sp>380){
    const t=Math.abs(b.x-own)/Math.abs(b.vx);
    const yp=b.y+b.vy*t;
    ty=clamp(yp,GY1-4,GY2+4);sf=2.6;
  }else if(!b.owner&&Math.abs(b.x-own)<170&&D(p,b)<200&&sp<300){
    const nearer=M.pl.some(q=>q!==p&&q.team!==p.team&&D(q,b)<D(p,b));
    if(!nearer){tx=b.x;ty=b.y;sf=1.5}
  }
  if(M.hum&&p.team===1&&false)return;
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),spd=240*(.85+.3*clamp((p.st-50)/45,.05,1))*sf*(p.boost>0?1.3:1);
  let vx=0,vy=0;if(d>3){const k=Math.min(1,d/25);vx=dx/d*spd*k;vy=dy/d*spd*k}
  accel(p,vx,vy,dt);
  p.x=clamp(p.x,p.team===0?p.r:MW-190,p.team===0?190:MW-p.r);
}
function aiOut(p,dt){
  const b=M.ball,car=b.owner,me=p.team,dir=me?-1:1;
  if(car===p){aiCarrier(p,dt);return}
  const poss=car?car.team===me:b.lastTeam===me;
  let hx=me?MW-p.hx*MW:p.hx*MW;
  hx+=(poss?.1:-.04)*MW*dir+(b.x-MW/2)*.18;
  const hy=p.hy*MH+(b.y-MH/2)*.25;
  let tx=clamp(hx,40,MW-40),ty=clamp(hy,30,MH-30),sf=.85;
  if(car&&car.team!==me){
    if(M.press[me].includes(p)){
      tx=car.x+car.vx*.25;ty=car.y+car.vy*.25;sf=1;
      if(D(p,car)<p.r+car.r+10&&p.cd<=0&&p.stun<=0)tryTackle(p,car,.9);
    }else sf=.9;
  }else if(!car&&M.chase[me]===p){tx=b.x+b.vx*.2;ty=b.y+b.vy*.2;sf=1.05}
  steer(p,tx,ty,sf,dt);
}
function plan(){
  const b=M.ball;M.press=[[],[]];M.chase=[null,null];
  for(const t of[0,1]){
    const outs=M.pl.filter(p=>p.team===t&&p.role!=='GK'&&!p.human&&p.stun<=0&&p.frozen<=0).sort((a,c)=>D(a,b)-D(c,b));
    if(b.owner){if(b.owner.team!==t){M.press[t]=outs.slice(0,1);if(outs[1]&&D(outs[1],b)<210)M.press[t].push(outs[1])}}
    else M.chase[t]=outs[0]||null;
  }
}

/* ----- ball + collisions ----- */
function ballStep(dt){
  const b=M.ball;
  if(b.owner){
    const o=b.owner,d=o.r+b.r+2;
    b.x=clamp(o.x+Math.cos(o.face)*d,b.r,MW-b.r);b.y=clamp(o.y+Math.sin(o.face)*d,b.r,MH-b.r);b.vx=o.vx;b.vy=o.vy;return;
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  const f=Math.exp(-.85*dt);b.vx*=f;b.vy*=f;
  if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.85}
  if(b.y>MH-b.r){b.y=MH-b.r;b.vy=-Math.abs(b.vy)*.85}
  // posts
  for(const[px,py]of[[0,GY1],[0,GY2],[MW,GY1],[MW,GY2]]){
    const dx=b.x-px,dy=b.y-py,d=Math.hypot(dx,dy),m=b.r+5;
    if(d<m&&d>0){const nx=dx/d,ny=dy/d;b.x=px+nx*m;b.y=py+ny*m;const dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=1.8*dot*nx;b.vy-=1.8*dot*ny;b.shot=null;toast('OFF THE POST!','#ffc933')}}
  }
  const inMouth=b.y>GY1&&b.y<GY2;
  if(b.x<0&&inMouth){goalScored(1);return}
  if(b.x>MW&&inMouth){goalScored(0);return}
  if(!inMouth){
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.8}
    if(b.x>MW-b.r){b.x=MW-b.r;b.vx=-Math.abs(b.vx)*.8}
  }
}
function goalScored(team){
  const b=M.ball,sh=b.shot;
  let scorer=sh?sh.by:b.lastK,assist=sh?sh.assist:null;
  if(scorer&&scorer.team!==team){scorer=null;assist=null}
  awardGoal(team,scorer,assist);
}
function awardGoal(team,scorer,assist){
  M.score[team]++;
  if(scorer&&scorer.human){M.S.goals++;addFire(40)}
  if(assist&&assist.human){M.S.assists++;addFire(25)}
  M.phase='goal';M.gt=2.4;M.kick=1-team;M.flash=1;M.flashTeam=team;
  M.ball.owner=null;M.ball.shot=null;
  const gx=team?0:MW;burst(gx?gx-10:10,MH/2,team?M.opc:M.myc,40,320);burst(gx?gx-10:10,MH/2,'#ffffff',20,240);
  const name=team===0?M.me.name:M.op.name;
  banner(team===0&&scorer&&scorer.human?'GOAL!':'GOAL!',`${esc(name)} ${M.score[0]}–${M.score[1]}${scorer&&scorer.human?' · you scored!':assist&&assist.human?' · your assist!':''}`);
}
function gkInteract(gk,sp){
  const b=M.ball;
  if(b.shot&&b.shot.team!==gk.team&&sp>=340){
    if(gk.rolled===b.shot.id)return;
    gk.rolled=b.shot.id;
    let sc=.4+(nf(gk.st)-b.shot.q)*1.1-(sp-800)/2500;
    if(Math.abs(b.y-MH/2)>GOALW/2-24)sc-=.18;
    if(gk.giant>0)sc+=.25;
    sc=clamp(sc,.08,.82);
    if(Math.random()<sc){
      if(gk.team===1&&b.shot.team===0)toast('Saved by the keeper!','#ff6a57');
      else if(gk.team===0)toast('GREAT SAVE!','#6fd3ff');
      const out=gk.team===0?1:-1;
      if(sp>650||Math.random()<.45){b.vx=out*Math.abs(b.vx)*.35+rnd(-40,40);b.vy=rnd(-240,240);b.shot=null;gk.np=.4;b.lastTeam=gk.team}
      else{takeBall(gk);gk.hold=rnd(.5,1)}
      burst(gk.x,gk.y,'#ffffff',10,160);
    }
    return;
  }
  if(b.shot&&b.shot.team===gk.team)return;
  if(sp<420&&gk.np<=0){takeBall(gk);gk.hold=rnd(.5,1)}
}
function pickups(){
  const b=M.ball;if(b.owner)return;
  const sp=Math.hypot(b.vx,b.vy);
  let best=null,bd=1e9;
  for(const p of M.pl){
    if(p.np>0||p.stun>0)continue;
    const d=D(p,b),reach=p.r+b.r+(p.role==='GK'?9:3);
    if(d>reach)continue;
    if(p.role==='GK'){gkInteract(p,sp);if(b.owner)return;continue}
    if(sp>540){
      if(b.shot&&b.shot.team!==p.team&&p.blk!==b.shot.id){
        p.blk=b.shot.id;
        const ch=p.human?.14+nf(G.stats.def)*.35:.12+nf(p.st)*.3;
        if(Math.random()<ch){b.vx*=-.3+rnd(-.3,.3);b.vy=b.vy*.3+rnd(-200,200);b.shot=null;b.lastTeam=p.team;toast(p.human?'BLOCKED!':'',p.human?'#6fd3ff':null);if(p.human)addFire(12);burst(b.x,b.y,'#fff',8,180)}
      }
      continue;
    }
    if(d<bd){bd=d;best=p}
  }
  if(best)takeBall(best);
}
function powerups(dt){
  if(M.pu){
    M.pu.l-=dt;if(M.pu.l<=0)M.pu=null;
    else for(const p of M.pl){
      if(p.role==='GK'||p.stun>0)continue;
      if(Math.hypot(p.x-M.pu.x,p.y-M.pu.y)<p.r+14){applyPU(p,M.pu.k);burst(M.pu.x,M.pu.y,'#ffc933',18,200);M.pu=null;break}
    }
  }else{
    M.puT-=dt;
    if(M.puT<=0){M.puT=rnd(10,15);M.pu={x:rnd(260,740),y:rnd(90,510),k:pick(['turbo','rocket','freeze','giant']),l:10}}
  }
}
function applyPU(p,k){
  const mine=p.team===0,hum=p.human;
  if(k==='turbo'){p.boost=6;if(hum)toast('TURBO!','#6fd3ff')}
  else if(k==='rocket'){p.rocket=1;if(hum)toast('ROCKET SHOT READY!','#ff6a57')}
  else if(k==='freeze'){M.pl.forEach(q=>{if(q.team!==p.team&&q.role!=='GK')q.frozen=2.6});toast(mine?'FREEZE! Opponents are on ice':'Opponent froze your team!',mine?'#6fd3ff':'#ff6a57')}
  else{const gk=M.pl.find(q=>q.team===p.team&&q.role==='GK');gk.giant=8;gk.r=30;if(mine)toast('GIANT KEEPER!','#ffc933')}
}
function startPen(){
  M.penDone=true;
  const pr={ST:.7,CM:.55,CB:.4}[G.role];
  const mine=Math.random()<pr;
  if(mine&&G.role!=='CB'){
    M.phase='pen';banner('PENALTY!','You step up');
    const ov=$('#ov');ov.hidden=false;
    ov.innerHTML=`<div class="box"><h2 style="font-size:40px">Penalty!</h2><div class="tip">Pick your corner. The keeper has to guess.</div><div class="pk"><button data-p="L">LEFT</button><button data-p="C">MIDDLE</button><button data-p="R">RIGHT</button></div></div>`;
    ov.querySelectorAll('button').forEach(b=>b.onclick=()=>penTake(b.dataset.p));
  }else{
    M.phase='pause2';M.pt=1.3;M.penAuto=mine?0:1;
    banner('PENALTY!',(mine?M.me.name:M.op.name)+' have a spot kick');
  }
}
function penTake(dir){
  $('#ov').hidden=true;
  const gk=['L','C','R'][Math.random()<.4?0:Math.random()<.34?1:2];
  const miss=(1-nf(G.stats.sho))*.22+.03;
  let scored;
  if(Math.random()<miss)scored=false;
  else if(gk===dir)scored=Math.random()<.2;
  else scored=true;
  M.S.shots++;if(scored||gk===dir)M.S.on++;
  M.phase='pause2';M.pt=1.2;M.penAuto=null;M.penRes={scored,human:true};
  banner(scored?'...':'...');
}
function updatePause2(dt){
  M.pt-=dt;if(M.pt>0)return;
  if(M.penAuto!==null&&M.penRes===undefined){
    const team=M.penAuto,scored=Math.random()<.75;
    if(scored){awardGoal(team,M.pl.find(q=>q.team===team&&q.role==='FWD'),null)}
    else{banner('SAVED!','No goal');M.phase='count';M.cnt=1.4;M.kick=1-team;lineup(M.kick)}
    return;
  }
  const r=M.penRes;M.penRes=undefined;
  if(r.scored)awardGoal(0,M.hum,null);
  else{banner('MISSED!','The keeper wins it');M.phase='count';M.cnt=1.4;M.kick=1;lineup(1)}
}

/* ----- main step ----- */
function step(dt){
  M.t+=dt;
  if(M.flash>0)M.flash-=dt*.6;
  for(const q of M.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;q.vx*=.96;q.vy*=.96}
  M.parts=M.parts.filter(q=>q.l>0);
  if(M.phase==='pre'||M.phase==='pen'||M.paused||M.phase==='over')return;
  if(M.phase==='count'){M.cnt-=dt;if(M.cnt<=0){M.phase='play';if(!M.min)banner('KICK OFF!')}return}
  if(M.phase==='goal'){
    M.gt-=dt;
    const b=M.ball;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.9;b.vy*=.9;
    b.x=clamp(b.x,-34,MW+34);
    if(M.gt<=0){lineup(M.kick);M.phase='count';M.cnt=1.2}
    return;
  }
  if(M.phase==='pause2'){updatePause2(dt);return}
  // PLAY
  M.min+=dt*90/MATCH_SEC;
  if(M.callT>0)M.callT-=dt;
  if(M.fireT>0){M.fireT-=dt;if(M.fireT<=0)toast('Fire burned out','#ffffff');else burst(M.hum.x,M.hum.y,Math.random()<.5?'#ff6a57':'#ffc933',1,70)}
  if(M.min>=45&&!M.htDone){M.htDone=true;M.phase='count';M.cnt=1.8;banner('HALF TIME',`${M.score[0]}–${M.score[1]}`);lineup(1);return}
  if(M.min>=M.penMin&&!M.penDone&&M.min<85){startPen();return}
  if(M.min>=90){endMatch();return}
  plan();
  powerups(dt);
  for(const p of M.pl){
    if(p.stun>0)p.stun-=dt;
    p.cd=Math.max(0,p.cd-dt);p.np=Math.max(0,p.np-dt);
    if(p.boost>0)p.boost-=dt;
    if(p.giant>0){p.giant-=dt;if(p.giant<=0)p.r=17}
    if(p.frozen>0){p.frozen-=dt;p.vx=p.vy=0;continue}
    if(p.human)humanUpdate(p,dt);
    else if(p.role==='GK')gkAI(p,dt);
    else aiOut(p,dt);
  }
  for(const p of M.pl){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.role!=='GK'){p.x=clamp(p.x,p.r,MW-p.r)}
    p.y=clamp(p.y,p.r,MH-p.r);
  }
  // separation
  const mass=p=>p.human?.8+1.2*nf(G.stats.phy):1;
  for(let i=0;i<M.pl.length;i++)for(let j=i+1;j<M.pl.length;j++){
    const a=M.pl[i],b=M.pl[j];
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d<m&&d>.01){
      const o=(m-d),ma=mass(a),mb=mass(b),ta=mb/(ma+mb),tb=ma/(ma+mb);
      a.x-=dx/d*o*ta;a.y-=dy/d*o*ta;b.x+=dx/d*o*tb;b.y+=dy/d*o*tb;
    }
  }
  ballStep(dt);
  if(M.phase!=='play')return;
  pickups();
}
function endMatch(){
  M.phase='over';
  banner('FULL TIME',`${M.score[0]}–${M.score[1]}`);
  setTimeout(finishMatch,1900);
}
function finishMatch(){
  if(!M)return;
  const S=M.S,my=M.score[0],op=M.score[1];
  let rt=6+S.goals*1.2+S.assists*.8+S.tackles*.2+S.passOK*.06-(S.passAtt-S.passOK)*.03+S.on*.12+(my>op?.5:my<op?-.3:0);
  if(G.role==='CB'&&op===0)rt+=.6;
  rt=clamp(rt,3,10);
  const res={my,opp:op,goals:S.goals,assists:S.assists,tackles:S.tackles,passOK:S.passOK,passAtt:S.passAtt,shots:S.shots,rating:rt,sim:false};
  const ni=M.ni;
  stopLoop();$('#match').hidden=true;M=null;
  finishResult(ni,res,false);
  render();
}

/* ----- drawing ----- */
function drawPitch(){
  const c=cx;
  c.fillStyle='#0a1f18';c.fillRect(-60,-60,MW+120,MH+120);
  // net behind goals
  for(const side of[0,1]){
    const x0=side?MW:-36;c.save();
    c.fillStyle='#0c1d17';c.fillRect(x0,GY1,36,GOALW);

    for(let i=0;i<=36;i+=6){c.moveTo(x0+i,GY1);c.lineTo(x0+i,GY2)}
    for(let j=0;j<=GOALW;j+=8){c.moveTo(x0,GY1+j);c.lineTo(x0+36,GY1+j)}
    c.stroke();
    if(M.flash>0&&M.flashTeam===(side?0:1)){c.fillStyle=`rgba(255,255,255,${M.flash*.6})`;c.fillRect(x0,GY1,36,GOALW)}
    c.restore();
  }
  // grass
  const stripes=10,w=MW/stripes;
  for(let i=0;i<stripes;i++){c.fillStyle=i%2?'#1c5a3a':'#1f6641';c.fillRect(i*w,0,w+1,MH)}
  c.strokeStyle='rgba(238,244,238,.75)';c.lineWidth=3;
  c.strokeRect(1.5,1.5,MW-3,MH-3);
  c.beginPath();c.moveTo(MW/2,0);c.lineTo(MW/2,MH);c.stroke();
  c.beginPath();c.arc(MW/2,MH/2,70,0,7);c.stroke();
  c.beginPath();c.arc(MW/2,MH/2,4,0,7);c.fillStyle='rgba(238,244,238,.75)';c.fill();
  c.strokeRect(0,140,150,320);c.strokeRect(MW-150,140,150,320);
  c.strokeRect(0,GY1-20,56,GOALW+40);c.strokeRect(MW-56,GY1-20,56,GOALW+40);
  // goal posts
  c.fillStyle='#fff';
  for(const[px,py]of[[0,GY1],[0,GY2],[MW,GY1],[MW,GY2]]){c.beginPath();c.arc(px,py,5,0,7);c.fill()}
  c.lineWidth=5;c.strokeStyle='#fff';c.beginPath();c.moveTo(0,GY1);c.lineTo(0,GY2);c.moveTo(MW,GY1);c.lineTo(MW,GY2);c.stroke();
}
function drawPlayer(p){

  if(M.fireT>0&&p.human){c.strokeStyle='#ff6a57';c.lineWidth=4;c.beginPath();c.arc(0,0,p.r+12,0,7);c.stroke()}
  shapePath(c,shape,p.r);
  c.fillStyle=col;c.fill();
  c.lineWidth=2.5;c.strokeStyle=p.team===0?'rgba(255,255,255,.85)':'rgba(0,0,0,.65)';c.stroke();

  if(p.human){c.fillStyle='#07140f';c.beginPath();c.arc(Math.cos(p.face)*p.r*.45,Math.sin(p.face)*p.r*.45,3.2,0,7);c.fill()}

  c.restore();
}
function drawBall(){
  const b=M.ball,c=cx;

function drawPU(){
  const u=M.pu;if(!u)return;

  c.save();c.translate(u.x,u.y);

function draw(){
  if(!M)return;
  const c=cx;
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);
  applyT();
  drawPitch();drawPU();
  for(const q of M.parts){c.globalAlpha=clamp(q.l/q.m,0,1);c.fillStyle=q.c;c.beginPath();c.arc(q.x,q.y,q.s,0,7);c.fill()}

  for(const p of M.pl)if(!p.human)drawPlayer(p);
  drawPlayer(M.hum);

  // screen-space labels
  c.setTransform(view.dpr,0,0,view.dpr,0,0);
  c.font='800 11px Figtree,sans-serif';c.textAlign='center';
  const[hx,hy]=toScr(M.hum.x,M.hum.y);
  c.fillStyle='#fff';c.beginPath();const ty=hy-M.hum.r*view.s-14;c.moveTo(hx,ty+8);c.lineTo(hx-6,ty);c.lineTo(hx+6,ty);c.closePath();c.fill();
  c.fillText('YOU',hx,ty-4);
  if(M.pu){const[ux,uy]=toScr(M.pu.x,M.pu.y);c.font='800 13px Figtree,sans-serif';c.fillStyle='#07140f';c.fillText({turbo:'TRB',rocket:'RKT',freeze:'ICE',giant:'GK+'}[M.pu.k],ux,uy+4)}
  // HUD
  $('#hs').textContent=`${M.score[0]} - ${M.score[1]}`;
  $('#hk').textContent=`${Math.min(90,Math.floor(M.min))}'`;
  $('#stam i').style.width=M.hum.sta+'%';
  $('#stam i').style.background=M.hum.tired?'#ff6a57':'#6fd3ff';
  const bf=$('#bF');bf.style.setProperty('--f',(M.fireT>0?M.fireT/9*100:M.fire)+'%');
  bf.classList.toggle('rdy',M.fire>=100&&M.fireT<=0);
}
function loop(ts){
  raf=requestAnimationFrame(loop);
  const dt=Math.min(.033,(ts-lastT)/1000||.016);lastT=ts;
  if(!M)return;
  step(dt);draw();
}
function runLoop(){cancelAnimationFrame(raf);lastT=performance.now();raf=requestAnimationFrame(loop)}
function stopLoop(){cancelAnimationFrame(raf)}

/* ----- match input wiring ----- */
(function(){
  const joy=$('#joy'),knob=$('#knob'),R=52;let jid=null;
  function mv(e){
    const r=joy.getBoundingClientRect();
    let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const m=Math.hypot(dx,dy),k=m>R?R/m:1;dx*=k;dy*=k;
    knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
    jv.x=Math.abs(dx/R)<.08?0:dx/R;jv.y=Math.abs(dy/R)<.08?0:dy/R;
  }
  joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(e.pointerId);mv(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)mv(e)});
  const up=e=>{if(e.pointerId===jid){jid=null;jv.x=jv.y=0;knob.style.transform='translate(-50%,-50%)'}};
  joy.addEventListener('pointerup',up);joy.addEventListener('pointercancel',up);
  function hold(id,on,off){
    const el=$(id);
    el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('dn');on()});
    const u=()=>{el.classList.remove('dn');off&&off()};
    el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u);el.addEventListener('pointerleave',u);
  }
  hold('#bA',()=>{act.pA=true});
  hold('#bB',()=>{act.pB=true});
  hold('#bS',()=>{act.sp=true},()=>{act.sp=false});
  hold('#bF',()=>{act.fire=true});
  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(!M||$('#match').hidden)return;
    if(k==='shift')act.sp=true;
    else if(k==='j'||k===' ')act.pA=true;
    else if(k==='k')act.pB=true;
    else if(k==='l')act.fire=true;
    else keys.add(k);
    if(k===' '||k.startsWith('arrow'))e.preventDefault();
  });
  addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='shift')act.sp=false;keys.delete(k)});
  $('#hp').addEventListener('click',()=>{
    if(!M||M.phase==='pre'||M.phase==='over')return;
    M.paused=true;
    const ov=$('#ov');ov.hidden=false;
    ov.innerHTML=`<div class="box"><h2 style="font-size:40px">Paused</h2><div class="mut" style="margin:6px 0 16px">${M.score[0]}–${M.score[1]} · ${Math.floor(M.min)}'</div><button class="btn pri full" id="rs">Resume</button><button class="btn full" style="margin-top:8px;border-color:var(--coral);color:var(--coral)" id="fq">Forfeit (0–3)</button></div>`;
    $('#rs').onclick=()=>{ov.hidden=true;M.paused=false;lastT=performance.now()};
    $('#fq').onclick=()=>{
      ov.hidden=true;const ni=M.ni;stopLoop();$('#match').hidden=true;M=null;
      finishResult(ni,{my:0,opp:3,goals:0,assists:0,tackles:0,passOK:0,passAtt:0,shots:0,rating:4,sim:false},false);render();
    };
  });
})();

/* =========================================================
   GLOBAL UI EVENTS
   ========================================================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const d=b.dataset,a=d.a;
  switch(a){
    case'create':startCreate();break;
    case'cont':{const g=loadSave();if(g){G=g;tab='home';render()}break}
    case'menu':G=null;render();break;
    case'cpos':cr.pos=d.k;cr.alloc={pace:0,sho:0,pas:0,dri:0,def:0,phy:0};cr.left=20;renderCreate();break;
    case'calloc':{const dl=+d.d;if(dl>0&&cr.left>0){cr.alloc[d.k]++;cr.left--}else if(dl<0&&cr.alloc[d.k]>0){cr.alloc[d.k]--;cr.left++}renderCreate();break}
    case'cclub':cr.club=+d.k;renderClubList();$('#bgn').disabled=false;break;
    case'begin':begin();break;
    case'tab':tab=d.k;if(d.s)sub.tbl=d.s;render();$('#app').scrollTop=0;break;
    case'stbl':sub.tbl=d.k;render();break;
    case'scomp':sub.comp=d.k;render();break;
    case'up':upgrade(d.k,d.d);break;
    case'accept':accept(+d.k);break;
    case'decline':G.offers.splice(+d.k,1);save();render();break;
    case'cancelmove':G.pending=null;save();render();break;
    case'enq':enquire(+d.k);break;
    case'play':{const ni=nextInfo();if(ni)startMatch(ni);break}
    case'simone':{const ni=nextInfo();if(ni){const r=simMine(ni);finishResult(ni,r,false);render()}break}
    case'simseason':if(confirm('Simulate the rest of the season? You earn fewer points from simulated games.')){simSeasonRest();render();$('#app').scrollTop=0}break;
    case'closeres':closeModal();tab='home';render();$('#app').scrollTop=0;break;
    case'toplayer':closeModal();tab='player';render();break;
    case'nextseason':nextSeason();break;
    case'savequit':save();G=null;render();break;
    case'newgame':if(confirm('Delete this career and start over?')){wipe();G=null;render()}break;
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='cn')cr.name=e.target.value;
  else if(id==='cq'){cr.q=e.target.value;renderClubList()}
  else if(id==='cl'){cr.lg=e.target.value;renderClubList()}
  else if(id==='call'){cr.all=e.target.checked;renderClubList()}
  else if(id==='mkq'){sub.mkQ=e.target.value;renderMkList()}
  else if(id==='mkl'){sub.mkLg=e.target.value;renderMkList()}
});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
